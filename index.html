<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26년 GGC 월례회</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ── Theme variables ── */
        :root {
            --bg-grad-start: #1b4332;
            --bg-grad-mid: #2d6a4f;
            --card-bg: #ffffff;
            --card-shadow: 0 6px 24px rgba(0,0,0,0.18);
            --text-primary: #1b4332;
            --text-secondary: #2d3748;
            --text-muted: #6b7e72;
            --text-faint: #9aab9d;
            --border: #e9f5ee;
            --border-light: #f0f4f1;
            --surface: #f0faf4;
            --surface-alt: #f7f9f8;
            --surface-hover: #e8f0eb;
            --counter-bg: #1b4332;
            --badge-bg: #d8f3dc;
            --badge-text: #1b4332;
            --input-border: #e2e8e4;
            --input-focus: #2d6a4f;
            --modal-bg: #ffffff;
            --modal-label: #555;
            --absentee-bg: #e2e8e4;
            --absentee-text: #6b7e72;
            --detail-item-bg: #f0faf4;
            --detail-item-text: #2d6a4f;
            --stats-row-hover: #f8fbf9;
            --rsc-bg: #ffffff;
            --rsc-border: #e2e8e4;
            --round-score-bg: #f7f9f8;
            --summary-box-bg: #f0faf4;
            --manual-row-border: #f0f4f1;
            --manual-name-color: #2d3748;
            --score-name-color: #2d3748;
        }
        body.dark {
            --bg-grad-start: #0d1f18;
            --bg-grad-mid: #162e22;
            --card-bg: #1a2e24;
            --card-shadow: 0 6px 24px rgba(0,0,0,0.5);
            --text-primary: #95d5b2;
            --text-secondary: #c8e6d8;
            --text-muted: #7aab8e;
            --text-faint: #4d7a62;
            --border: #2a4a38;
            --border-light: #243d2f;
            --surface: #1f3829;
            --surface-alt: #1a2e24;
            --surface-hover: #243d2f;
            --counter-bg: #0d1f18;
            --badge-bg: #1f3829;
            --badge-text: #95d5b2;
            --input-border: #2a4a38;
            --input-focus: #52b788;
            --modal-bg: #1a2e24;
            --modal-label: #7aab8e;
            --absentee-bg: #243d2f;
            --absentee-text: #7aab8e;
            --detail-item-bg: #1f3829;
            --detail-item-text: #95d5b2;
            --stats-row-hover: #1f3829;
            --rsc-bg: #1f3829;
            --rsc-border: #2a4a38;
            --round-score-bg: #1f3829;
            --summary-box-bg: #1f3829;
            --manual-row-border: #243d2f;
            --manual-name-color: #c8e6d8;
            --score-name-color: #c8e6d8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: linear-gradient(160deg, var(--bg-grad-start) 0%, var(--bg-grad-mid) 60%, var(--bg-grad-start) 100%);
            min-height: 100vh;
            padding: 24px 16px 60px;
            transition: background 0.4s;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .header { text-align: center; color: white; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .header .sub { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,0.55); }

        /* Loading overlay */
        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(27,67,50,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; flex-direction: column; gap: 14px;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #95d5b2;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p { color: #d8f3dc; font-size: 14px; }

        /* Tabs */
        .tab-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-bottom: 16px; }
        .tab-scroll::-webkit-scrollbar { display: none; }
        .tab-row { display: flex; gap: 6px; padding: 4px 2px 6px; min-width: max-content; }

        .tab-btn {
            display: flex; flex-direction: column; align-items: center;
            padding: 9px 14px; border-radius: 12px; border: 2px solid transparent;
            background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.65);
            cursor: pointer; transition: all 0.18s; min-width: 72px; position: relative;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.2); color: white; }
        .tab-btn.active { background: white; color: #1b4332; border-color: white; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
        .tab-btn .tab-date { font-size: 13px; font-weight: 700; line-height: 1; }
        .tab-btn .tab-venue { font-size: 10px; margin-top: 3px; opacity: 0.7; }
        .tab-btn.active .tab-venue { opacity: 0.6; }
        .tab-btn .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: #52b788; position: absolute; top: 5px; right: 5px; }
        .tab-btn.incomplete { background: rgba(220,60,60,0.75); color: white; border-color: rgba(255,120,120,0.5); }
        .tab-btn.incomplete:hover { background: rgba(220,60,60,0.9); }
        .tab-btn.incomplete.active { background: #fff0f0; color: #c0392b; border-color: #e74c3c; box-shadow: 0 4px 14px rgba(220,60,60,0.25); }
        .tab-btn.complete { background: rgba(82,183,136,0.3); color: white; border-color: rgba(82,183,136,0.4); }
        .tab-btn.complete:hover { background: rgba(82,183,136,0.45); }
        .tab-btn.complete.active { background: #d8f3dc; color: #1b4332; border-color: #52b788; box-shadow: 0 4px 14px rgba(82,183,136,0.3); }
        .tab-btn.add-tab { font-size: 20px; color: rgba(255,255,255,0.7); min-width: 48px; padding: 9px 12px; }
        .tab-btn.add-tab:hover { color: white; }
        /* 다크모드 active 탭 — 밝은 민트로 강조 */
        body.dark .tab-btn.active { background: #95d5b2; color: #0d1f18; border-color: #95d5b2; box-shadow: 0 4px 18px rgba(149,213,178,0.4); }
        body.dark .tab-btn.incomplete.active { background: #fca5a5; color: #3b0a0a; border-color: #f87171; box-shadow: 0 4px 14px rgba(248,113,113,0.3); }
        body.dark .tab-btn.complete.active { background: #6ee7b7; color: #0d1f18; border-color: #6ee7b7; box-shadow: 0 4px 18px rgba(110,231,183,0.35); }

        /* Card */
        .card { background: var(--card-bg); border-radius: 18px; padding: 20px; margin-bottom: 12px; box-shadow: var(--card-shadow); transition: background 0.4s, box-shadow 0.4s; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        .round-info-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--badge-bg); color: var(--badge-text); font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
        .round-info-badge .venue-tag { background: var(--text-primary); color: var(--badge-bg); font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .round-detail-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
        .round-detail-item { display: inline-flex; align-items: center; gap: 5px; background: var(--detail-item-bg); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--detail-item-text); }
        .round-detail-item .detail-icon { font-size: 13px; }
        .btn-edit-round { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #52b788; cursor: pointer; transition: all 0.15s; }
        .btn-edit-round:hover { border-color: #52b788; background: var(--surface); }

        /* Counter bar */
        .counter-bar { background: var(--counter-bg); border-radius: 12px; padding: 13px 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .counter-bar .label { color: rgba(255,255,255,0.7); font-size: 13px; }
        .counter-bar .count { font-size: 22px; font-weight: 800; color: #95d5b2; }
        .counter-bar .count span { color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 400; }
        .progress-wrap { background: rgba(255,255,255,0.15); border-radius: 6px; height: 5px; margin-top: 8px; width: 200px; }
        .progress-fill { height: 5px; border-radius: 6px; background: #95d5b2; transition: width 0.3s; }

        /* Member grid */
        .member-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
        .member-item { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.13s; user-select: none; }
        .member-item:hover:not(.disabled) { border-color: #52b788; background: var(--surface); }
        .member-item.selected { border-color: var(--text-primary); background: var(--badge-bg); }
        .member-item.disabled { opacity: 0.35; cursor: not-allowed; }
        .member-checkbox { width: 17px; height: 17px; accent-color: #1b4332; flex-shrink: 0; }
        .member-name { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .member-item.selected .member-name { color: var(--text-primary); }

        .warning { margin-top: 10px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 8px 13px; font-size: 13px; color: #856404; display: none; }

        /* Guest */
        .guest-section { margin-top: 10px; }
        .guest-section-label { font-size: 11px; font-weight: 700; color: #9aab9d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
        .member-item.guest { border-color: #fde8c8; background: #fffbf5; }
        .member-item.guest:hover:not(.disabled) { border-color: #f59e0b; background: #fef3e2; }
        .member-item.guest.selected { border-color: #f59e0b; background: #fef3e2; }
        .member-item.guest.selected .member-name { color: #92400e; }
        .guest-badge { font-size: 10px; background: #f59e0b; color: white; padding: 1px 6px; border-radius: 8px; font-weight: 700; flex-shrink: 0; }
        .guest-remove { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; background: #fee2e2; color: #ef4444; border: none; cursor: pointer; font-size: 13px; font-weight: 700; line-height: 1; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .guest-remove:hover { background: #fecaca; }
        .add-guest-btn { margin-top: 8px; width: 100%; padding: 9px; border: 2px dashed #d1e8da; border-radius: 10px; background: transparent; color: #52b788; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .add-guest-btn:hover { border-color: #52b788; background: #f0faf4; }
        .add-guest-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Buttons */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.18s; }
        .btn-primary { background: linear-gradient(135deg, #1b4332, #2d6a4f); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(27,67,50,0.4); }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary:disabled { background: #c8d5cc; color: #8fa898; cursor: not-allowed; }
        .btn-secondary { background: var(--surface); color: #2d6a4f; margin-top: 10px; font-size: 14px; }
        .btn-secondary:hover { background: var(--surface-hover); }
        .btn-danger { background: #fff0f0; color: #c0392b; margin-top: 8px; font-size: 13px; padding: 10px; }
        .btn-danger:hover { background: #ffe0e0; }
        body.dark .btn-danger { background: #2a1a1a; color: #f87171; }
        body.dark .btn-danger:hover { background: #3a2020; }

        /* Result */
        .result-section { display: none; }
        .result-header { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; }
        .group-card { border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .group-1 { background: linear-gradient(135deg, #fff8e1, #ffecb3); border-left: 4px solid #f59e0b; }
        .group-2 { background: linear-gradient(135deg, #e0f2fe, #bae6fd); border-left: 4px solid #0ea5e9; }
        .group-3 { background: linear-gradient(135deg, #fce7f3, #fbcfe8); border-left: 4px solid #ec4899; }
        .group-label { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
        .group-1 .group-label { color: #b45309; }
        .group-2 .group-label { color: #0369a1; }
        .group-3 .group-label { color: #9d174d; }
        .group-members-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .group-member-chip { background: rgba(255,255,255,0.85); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-weight: 600; text-align: center; }

        .absentees-box { margin-top: 12px; background: var(--surface-alt); border-radius: 10px; padding: 11px 14px; }
        .absentees-label { font-size: 11px; color: var(--text-faint); font-weight: 600; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
        .absentee-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .absentee-tag { background: var(--absentee-bg); color: var(--absentee-text); padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 500; }

        /* Score input */
        .score-section { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
        .score-section-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .score-group { margin-bottom: 12px; }
        .score-group-label { font-size: 12px; font-weight: 700; margin-bottom: 7px; }
        .group-1 .score-group-label { color: #b45309; }
        .group-2 .score-group-label { color: #0369a1; }
        .group-3 .score-group-label { color: #9d174d; }
        .score-rows { display: flex; flex-direction: column; gap: 6px; }
        .score-row { display: flex; align-items: center; gap: 8px; }
        .score-row .s-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--score-name-color); }
        .score-input { width: 72px; padding: 7px 10px; border: 2px solid var(--input-border); border-radius: 8px; font-size: 14px; font-weight: 700; text-align: center; outline: none; transition: border-color 0.15s; background: var(--card-bg); color: var(--text-secondary); }
        .score-input:focus { border-color: var(--input-focus); }
        .score-input.has-value { border-color: #52b788; background: var(--surface); }
        .btn-save-scores { background: linear-gradient(135deg, #1b4332, #2d6a4f); color: white; border: none; border-radius: 10px; padding: 11px 20px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; transition: all 0.18s; }
        .btn-save-scores:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(27,67,50,0.35); }
        .score-saved-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--badge-bg); color: var(--badge-text); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--modal-bg); border-radius: 18px; padding: 24px; width: 100%; max-width: 360px; }
        .modal h3 { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--modal-label); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 11px 14px; border: 2px solid var(--input-border); border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.15s; background: var(--card-bg); color: var(--text-secondary); }
        .form-group input:focus { border-color: var(--input-focus); }
        .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
        .modal-actions .btn { margin: 0; }

        /* Manual assign modal */
        .manual-modal { max-width: 420px; max-height: 88vh; overflow-y: auto; }
        .manual-assign-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--manual-row-border); }
        .manual-assign-row:last-child { border-bottom: none; }
        .manual-assign-name { font-size: 14px; font-weight: 600; color: var(--manual-name-color); flex: 1; }
        .group-btn-set { display: flex; gap: 5px; }
        .group-btn { padding: 5px 13px; border-radius: 8px; border: 2px solid var(--input-border); background: var(--card-bg); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.13s; color: var(--text-faint); }
        .group-btn:hover { border-color: #aaa; color: var(--text-secondary); }
        .group-btn.sel-a { border-color: #f59e0b; background: #fff8e1; color: #b45309; }
        .group-btn.sel-b { border-color: #0ea5e9; background: #e0f2fe; color: #0369a1; }
        .group-btn.sel-c { border-color: #ec4899; background: #fce7f3; color: #9d174d; }
        .manual-count-bar { display: flex; gap: 8px; margin-bottom: 14px; }
        .mcb { flex: 1; border-radius: 8px; padding: 7px; text-align: center; font-size: 12px; font-weight: 700; }
        .mcb-1 { background: #fff8e1; color: #b45309; border: 1.5px solid #f59e0b; }
        .mcb-2 { background: #e0f2fe; color: #0369a1; border: 1.5px solid #0ea5e9; }
        .mcb-3 { background: #fce7f3; color: #9d174d; border: 1.5px solid #ec4899; }
        .mcb .mcb-n { font-size: 18px; line-height: 1; }
        .manual-error { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #856404; margin-top: 10px; display: none; }

        .reset-link { text-align: center; margin-top: 8px; }
        .reset-link a { color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; text-decoration: underline; }
        .reset-link a:hover { color: rgba(255,255,255,0.75); }

        /* Nav tabs */
        .nav-tabs { display: flex; gap: 6px; margin-bottom: 18px; background: rgba(0,0,0,0.15); border-radius: 14px; padding: 4px; }
        .nav-tab { flex: 1; padding: 9px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: rgba(255,255,255,0.6); transition: all 0.18s; }
        .nav-tab.active { background: white; color: #1b4332; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .nav-tab:hover:not(.active) { color: white; }

        /* Stats */
        .stats-table { width: 100%; border-collapse: collapse; }
        .stats-table th { font-size: 12px; font-weight: 700; color: var(--text-faint); text-align: center; padding: 6px 4px 10px; text-transform: uppercase; letter-spacing: 0.4px; }
        .stats-table th:first-child { text-align: left; }
        .stats-table td { padding: 10px 4px; border-top: 1px solid var(--border-light); font-size: 14px; text-align: center; vertical-align: middle; }
        .stats-table td:first-child { font-weight: 700; color: var(--text-primary); text-align: left; }
        .stats-table tr:hover td { background: var(--stats-row-hover); }
        .rank-badge { display: inline-block; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; line-height: 22px; text-align: center; }
        .rank-1 { background: #fef3c7; color: #b45309; }
        .rank-2 { background: #e5e7eb; color: #4b5563; }
        .rank-3 { background: #fde8c8; color: #92400e; }
        .rank-n { background: #f3f4f6; color: #9ca3af; font-size: 10px; }
        .att-bar-wrap { background: #e9f5ee; border-radius: 20px; height: 8px; width: 80px; margin: 0 auto; }
        .att-bar { height: 8px; border-radius: 20px; background: linear-gradient(90deg, #52b788, #1b4332); transition: width 0.4s; }
        .att-count { font-weight: 800; color: var(--text-primary); }
        .abs-count { color: #ef4444; font-weight: 600; }
        .rate-text { font-size: 12px; color: var(--text-muted); }
        .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .summary-box { background: var(--summary-box-bg); border-radius: 12px; padding: 12px; text-align: center; }
        .summary-box .s-val { font-size: 22px; font-weight: 800; color: var(--text-primary); line-height: 1; }
        .summary-box .s-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* Score stats */
        .stats-sub-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 20px 0 10px; padding-top: 16px; border-top: 1px solid var(--border); }
        .score-stats-table { width: 100%; border-collapse: collapse; }
        .score-stats-table th { font-size: 12px; font-weight: 700; color: var(--text-faint); text-align: center; padding: 6px 4px 10px; }
        .score-stats-table th:first-child { text-align: left; }
        .score-stats-table td { padding: 10px 4px; border-top: 1px solid var(--border-light); font-size: 14px; text-align: center; vertical-align: middle; }
        .score-stats-table td:first-child { font-weight: 700; color: var(--text-primary); text-align: left; }
        .score-stats-table tr:hover td { background: var(--stats-row-hover); }
        .score-val { font-weight: 800; color: var(--text-primary); }
        .score-best { color: #0369a1; font-weight: 800; }
        .score-worst { color: #c0392b; font-weight: 600; font-size: 12px; }
        .no-score { color: #c8d5cc; font-size: 12px; }

        /* Round score history */
        .round-score-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .round-score-item { background: var(--round-score-bg); border-radius: 10px; padding: 10px 13px; }

        .round-score-item .rsi-date { font-size: 13px; font-weight: 700; color: var(--text-primary); }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</head>

<script>
const SUPABASE_URL = 'https://rjxtdrkdabnpyohasiyw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YYLwxN1W8rpkfTF0_PvpCA_60mL7iu4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MEMBERS = [
    '곽영주', '권태영', '김대호', '김동영',
    '김동유', '김성래', '김정국', '김정탁',
    '신용훈', '양성민', '이준헌', '임재용',
    '장노륜', '장성집', '조주영', '홍상현'
];
const MAX = 12;

let rounds = [];       // [{id, date, venue, is_custom}]
let attendance = {};   // {round_id: Set<member_name>}
let guests = {};       // {round_id: Set<name>}
let groupResults = {}; // {round_id: [[m1,m2,m3,m4],[...],[...]]}
let scores = {};       // {round_id: {member_name: score}}
let activeId = null;

// 날짜 문자열 "6/19(금)" → 정렬용 숫자 (월*100+일)
function parseDateOrder(dateStr) {
    const m = dateStr.match(/(\d+)\/(\d+)/);
    if (!m) return 9999;
    return parseInt(m[1]) * 100 + parseInt(m[2]);
}

function sortRounds() {
    rounds.sort((a, b) => parseDateOrder(a.date) - parseDateOrder(b.date));
}

function getDefaultRoundId() {
    if (rounds.length === 0) return null;
    const now = new Date();
    const todayOrder = (now.getMonth() + 1) * 100 + now.getDate();
    // 오늘 이후 라운드 중 가장 가까운 것
    const upcoming = rounds.find(r => parseDateOrder(r.date) >= todayOrder);
    // 없으면 마지막 라운드 (모두 지난 경우)
    return upcoming ? upcoming.id : rounds[rounds.length - 1].id;
}

// --- Init ---
async function init() {
    showLoading(true);
    try {
        const [rRes, aRes, gRes, sRes] = await Promise.all([
            sb.from('rounds').select('*').order('created_at'),
            sb.from('attendance').select('*'),
            sb.from('group_results').select('*').order('group_index').order('id'),
            sb.from('scores').select('*'),
        ]);

        if (rRes.error) throw rRes.error;
        if (aRes.error) throw aRes.error;
        if (gRes.error) throw gRes.error;
        if (sRes.error) throw new Error('scores 테이블 오류: ' + sRes.error.message);

        rounds = rRes.data || [];
        sortRounds();

        attendance = {};
        guests = {};
        rounds.forEach(r => { attendance[r.id] = new Set(); guests[r.id] = new Set(); });
        (aRes.data || []).forEach(a => {
            if (!attendance[a.round_id]) attendance[a.round_id] = new Set();
            if (!guests[a.round_id]) guests[a.round_id] = new Set();
            attendance[a.round_id].add(a.member_name);
            if (a.is_guest) guests[a.round_id].add(a.member_name);
        });

        groupResults = {};
        (gRes.data || []).forEach(g => {
            if (!groupResults[g.round_id]) groupResults[g.round_id] = [[], [], []];
            const grp = groupResults[g.round_id][g.group_index];
            if (grp && grp.length < 4 && !grp.includes(g.member_name)) {
                grp.push(g.member_name);
            }
        });

        scores = {};
        (sRes.data || []).forEach(s => {
            if (!scores[s.round_id]) scores[s.round_id] = {};
            scores[s.round_id][s.member_name] = s.score;
        });

        activeId = getDefaultRoundId();
        render();
        setTimeout(() => scrollActiveTabToCenter(false), 80);
    } catch(e) {
        showToast('데이터 로드 실패: ' + e.message);
    }
    showLoading(false);
}

function activeRound() { return rounds.find(r => r.id === activeId); }

// --- Render ---
function render() {
    renderTabs();
    if (!activeRound()) return;
    const round = activeRound();
    const sel = attendance[round.id] || new Set();

    document.getElementById('roundDateLabel').textContent = round.date;
    document.getElementById('roundVenueLabel').textContent = round.venue;
    renderRoundDetailBar(round);

    const n = sel.size;
    document.getElementById('countDisplay').innerHTML = `${n} <span>/ ${MAX}명</span>`;
    document.getElementById('progressFill').style.width = `${(n / MAX) * 100}%`;
    document.getElementById('assignBtn').disabled = n !== MAX;

    document.getElementById('memberGrid').innerHTML = MEMBERS.map(name => {
        const isSel = sel.has(name);
        const isDisabled = !isSel && sel.size >= MAX;
        return `
            <div class="member-item${isSel ? ' selected' : ''}${isDisabled ? ' disabled' : ''}"
                 onclick="toggleMember('${name}')">
                <input class="member-checkbox" type="checkbox"
                       ${isSel ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}
                       onclick="event.preventDefault()">
                <span class="member-name">${name}</span>
            </div>
        `;
    }).join('');

    // Guest section
    const guestSet = guests[round.id] || new Set();
    const isFull = sel.size >= MAX;
    const guestItems = [...guestSet].map(name => {
        const isSel = sel.has(name);
        const isDisabled = !isSel && isFull;
        return `
            <div class="member-item guest${isSel ? ' selected' : ''}${isDisabled ? ' disabled' : ''}"
                 onclick="toggleMember('${name}')">
                <input class="member-checkbox" type="checkbox"
                       ${isSel ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}
                       onclick="event.preventDefault()">
                <span class="member-name">${name}</span>
                <span class="guest-badge">게스트</span>
                <button class="guest-remove" onclick="event.stopPropagation(); removeGuest('${name}')" title="게스트 삭제">×</button>
            </div>
        `;
    }).join('');

    document.getElementById('guestSection').innerHTML = `
        ${guestSet.size > 0 ? `<div class="guest-section-label">게스트</div><div class="member-grid">${guestItems}</div>` : ''}
        <button class="add-guest-btn" ${isFull ? 'disabled' : ''} onclick="openGuestModal()">
            + 게스트 추가
        </button>
    `;

    const groups = groupResults[round.id];
    const resultCard = document.getElementById('resultCard');
    if (groups && groups.some(g => g.length > 0)) {
        resultCard.style.display = 'block';
        renderGroupResult(groups, sel);
        renderScoreInputs(round.id, groups);
    } else {
        resultCard.style.display = 'none';
    }
}

function renderTabs() {
    const row = document.getElementById('tabRow');
    row.innerHTML = rounds.map(r => {
        const isActive = r.id === activeId;
        const count = (attendance[r.id] || new Set()).size;
        const isFull = count === MAX;
        const hasAny = count > 0;
        let statusClass = hasAny ? (isFull ? 'complete' : 'incomplete') : '';
        return `
            <div class="tab-btn ${statusClass}${isActive ? ' active' : ''}" onclick="switchTab('${r.id}')">
                ${hasAny && !isFull ? `<div class="tab-dot" style="background:#ff6b6b"></div>` : ''}
                ${isFull && !isActive ? `<div class="tab-dot"></div>` : ''}
                <div class="tab-date">${r.date}</div>
                <div class="tab-venue">${r.venue}</div>
                ${hasAny ? `<div style="font-size:10px;margin-top:2px;opacity:0.8">${count}/${MAX}</div>` : ''}
            </div>
        `;
    }).join('') + `<div class="tab-btn add-tab" onclick="openModal()" title="라운드 추가">＋</div>`;
}

function scrollActiveTabToCenter(smooth) {
    const idx = rounds.findIndex(r => r.id === activeId);
    const tabs = document.querySelectorAll('.tab-btn:not(.add-tab)');
    const tab = tabs[idx];
    const scroll = document.querySelector('.tab-scroll');
    if (!tab || !scroll) return;
    const tabLeft = tab.offsetLeft;
    const tabWidth = tab.offsetWidth;
    const scrollWidth = scroll.offsetWidth;
    const target = tabLeft - (scrollWidth / 2) + (tabWidth / 2);
    scroll.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'instant' });
}

function switchTab(id) {
    activeId = id;
    render();
    setTimeout(() => scrollActiveTabToCenter(true), 50);
}

// --- Toggle member ---
async function toggleMember(name) {
    const round = activeRound();
    const sel = attendance[round.id] || new Set();
    const isGuest = (guests[round.id] || new Set()).has(name);

    if (sel.has(name)) {
        sel.delete(name);
        attendance[round.id] = sel;
        // 조편성에서 해당 멤버만 제거
        const grps = groupResults[round.id];
        if (grps) groupResults[round.id] = grps.map(g => g.filter(n => n !== name));
        render();
        await sb.from('attendance').delete()
            .eq('round_id', round.id).eq('member_name', name);
        await sb.from('group_results').delete()
            .eq('round_id', round.id).eq('member_name', name);
    } else {
        if (sel.size >= MAX) { showWarning(); return; }
        sel.add(name);
        attendance[round.id] = sel;
        // 조편성은 그대로 유지 (새 멤버는 미배정)
        render();
        await sb.from('attendance').upsert({ round_id: round.id, member_name: name, is_guest: isGuest });
    }
    renderTabs();
}

// --- Guest ---
function openGuestModal() {
    document.getElementById('inputGuestName').value = '';
    document.getElementById('guestModalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputGuestName').focus(), 100);
}
function closeGuestModal() { document.getElementById('guestModalOverlay').classList.remove('open'); }

async function addGuest() {
    const name = document.getElementById('inputGuestName').value.trim();
    if (!name) { alert('이름을 입력해주세요.'); return; }
    const round = activeRound();
    const sel = attendance[round.id] || new Set();
    if (sel.size >= MAX) { showWarning(); closeGuestModal(); return; }

    if (!guests[round.id]) guests[round.id] = new Set();
    guests[round.id].add(name);
    sel.add(name);
    attendance[round.id] = sel;
    groupResults[round.id] = null;
    closeGuestModal();
    render();
    renderTabs();

    await sb.from('attendance').upsert({ round_id: round.id, member_name: name, is_guest: true });
    showToast(`${name} 게스트 추가`);
}

async function removeGuest(name) {
    if (!confirm(`게스트 "${name}"을(를) 삭제할까요?`)) return;
    const round = activeRound();
    guests[round.id].delete(name);
    attendance[round.id].delete(name);
    const grps = groupResults[round.id];
    if (grps) groupResults[round.id] = grps.map(g => g.filter(n => n !== name));
    render();
    renderTabs();
    await sb.from('attendance').delete().eq('round_id', round.id).eq('member_name', name);
    await sb.from('group_results').delete().eq('round_id', round.id).eq('member_name', name);
    showToast(`${name} 삭제됨`);
}

function showWarning() {
    const w = document.getElementById('warningMsg');
    w.style.display = 'block';
    clearTimeout(w._t);
    w._t = setTimeout(() => { w.style.display = 'none'; }, 2200);
}

// --- Assign groups ---
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

async function assignGroups() {
    const round = activeRound();
    const sel = attendance[round.id] || new Set();
    const participants = shuffle([...sel]);
    const groups = [
        participants.slice(0, 4),
        participants.slice(4, 8),
        participants.slice(8, 12)
    ];
    groupResults[round.id] = groups;
    render();
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

    const { error: delErr } = await sb.from('group_results').delete().eq('round_id', round.id);
    if (!delErr) {
        const rows = [];
        groups.forEach((g, gi) => g.forEach(name => rows.push({ round_id: round.id, group_index: gi, member_name: name })));
        await sb.from('group_results').insert(rows);
    }
    showToast('조편성이 저장되었습니다');
}

function renderGroupResult(groups, sel) {
    const configs = [
        { cls: 'group-1', label: '🟠 1조' },
        { cls: 'group-2', label: '🔵 2조' },
        { cls: 'group-3', label: '🩷 3조' }
    ];
    document.getElementById('groupResults').innerHTML = groups.map((g, i) => `
        <div class="group-card ${configs[i].cls}">
            <div class="group-label">${configs[i].label}</div>
            <div class="group-members-grid">
                ${g.map(n => `<div class="group-member-chip">${n}</div>`).join('')}
            </div>
        </div>
    `).join('');

    const absentees = MEMBERS.filter(m => !sel.has(m));
    document.getElementById('absenteeTags').innerHTML =
        absentees.map(n => `<span class="absentee-tag">${n}</span>`).join('');
}

// --- Score input ---
function renderScoreInputs(roundId, groups) {
    const configs = [
        { cls: 'group-1', label: '🟠 1조' },
        { cls: 'group-2', label: '🔵 2조' },
        { cls: 'group-3', label: '🩷 3조' }
    ];
    const roundScores = scores[roundId] || {};
    const hasSaved = Object.keys(roundScores).length > 0;

    document.getElementById('scoreSavedBadge').style.display = hasSaved ? 'inline-flex' : 'none';

    document.getElementById('scoreInputGroups').innerHTML = groups.map((g, i) => `
        <div class="score-group ${configs[i].cls}" style="padding:10px;border-radius:10px;margin-bottom:8px;">
            <div class="score-group-label">${configs[i].label}</div>
            <div class="score-rows">
                ${g.map(name => {
                    const val = roundScores[name] !== undefined ? roundScores[name] : '';
                    return `
                        <div class="score-row">
                            <span class="s-name">${name}</span>
                            <input class="score-input${val !== '' ? ' has-value' : ''}"
                                   type="number" min="50" max="150"
                                   placeholder="타수"
                                   value="${val}"
                                   data-name="${name}"
                                   oninput="this.classList.toggle('has-value', this.value !== '')">
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `).join('');
}

async function saveScores() {
    const round = activeRound();
    const inputs = document.querySelectorAll('#scoreInputGroups .score-input');
    const newScores = {};
    inputs.forEach(inp => {
        const val = inp.value.trim();
        if (val !== '') {
            const n = parseInt(val);
            if (!isNaN(n) && n >= 50 && n <= 200) newScores[inp.dataset.name] = n;
        }
    });

    if (Object.keys(newScores).length === 0) {
        showToast('입력된 타수가 없습니다');
        return;
    }

    if (!scores[round.id]) scores[round.id] = {};
    Object.assign(scores[round.id], newScores);

    const rows = Object.entries(newScores).map(([member_name, score]) => ({
        round_id: round.id, member_name, score
    }));
    const { error } = await sb.from('scores').upsert(rows, { onConflict: 'round_id,member_name' });
    if (error) {
        showToast('저장 실패: ' + error.message);
        return;
    }
    showToast('결과 저장됨');
    document.getElementById('scoreSavedBadge').style.display = 'inline-flex';
}

// --- Manual assign ---
let manualAssign = {}; // {name: '1'|'2'|'3'|null}

function openManualModal() {
    const round = activeRound();
    const sel = [...(attendance[round.id] || new Set())];
    const existing = groupResults[round.id];

    manualAssign = {};
    sel.forEach(name => { manualAssign[name] = null; });
    if (existing && existing.some(g => g.length > 0)) {
        existing.forEach((grp, gi) => {
            const key = ['1','2','3'][gi];
            grp.forEach(name => { if (name in manualAssign) manualAssign[name] = key; });
        });
    }

    renderManualRows(sel);
    document.getElementById('manualError').style.display = 'none';
    document.getElementById('manualModalOverlay').classList.add('open');
}

function closeManualModal() {
    document.getElementById('manualModalOverlay').classList.remove('open');
}

function renderManualRows(members) {
    const counts = { '1': 0, '2': 0, '3': 0 };
    Object.values(manualAssign).forEach(v => { if (v) counts[v]++; });
    document.getElementById('mcb1').textContent = counts['1'];
    document.getElementById('mcb2').textContent = counts['2'];
    document.getElementById('mcb3').textContent = counts['3'];

    document.getElementById('manualAssignRows').innerHTML = members.map(name => {
        const cur = manualAssign[name];
        return `
            <div class="manual-assign-row">
                <span class="manual-assign-name">${name}</span>
                <div class="group-btn-set">
                    <button class="group-btn${cur==='1'?' sel-a':''}" onclick="setManualGroup('${name}','1')">1조</button>
                    <button class="group-btn${cur==='2'?' sel-b':''}" onclick="setManualGroup('${name}','2')">2조</button>
                    <button class="group-btn${cur==='3'?' sel-c':''}" onclick="setManualGroup('${name}','3')">3조</button>
                </div>
            </div>
        `;
    }).join('');
}

function setManualGroup(name, grp) {
    const round = activeRound();
    const sel = [...(attendance[round.id] || new Set())];
    const counts = { '1': 0, '2': 0, '3': 0 };
    Object.entries(manualAssign).forEach(([n, v]) => { if (v && n !== name) counts[v]++; });

    if (manualAssign[name] === grp) {
        manualAssign[name] = null;
    } else {
        if (counts[grp] >= 4) {
            const errEl = document.getElementById('manualError');
            errEl.textContent = `⚠️ ${grp}조는 최대 4명까지 가능합니다.`;
            errEl.style.display = 'block';
            setTimeout(() => { errEl.style.display = 'none'; }, 2000);
            return;
        }
        manualAssign[name] = grp;
    }
    renderManualRows(sel);
}

async function saveManualAssign() {
    const round = activeRound();
    const sel = [...(attendance[round.id] || new Set())];

    const unassigned = sel.filter(n => !manualAssign[n]);
    if (unassigned.length > 0) {
        const errEl = document.getElementById('manualError');
        errEl.textContent = `⚠️ 미배정 멤버가 있습니다: ${unassigned.join(', ')}`;
        errEl.style.display = 'block';
        return;
    }

    const groups = [
        sel.filter(n => manualAssign[n] === '1'),
        sel.filter(n => manualAssign[n] === '2'),
        sel.filter(n => manualAssign[n] === '3'),
    ];

    groupResults[round.id] = groups;
    closeManualModal();
    render();
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

    const { error: delErr } = await sb.from('group_results').delete().eq('round_id', round.id);
    if (!delErr) {
        const rows = [];
        groups.forEach((g, gi) => g.forEach(name => rows.push({ round_id: round.id, group_index: gi, member_name: name })));
        await sb.from('group_results').insert(rows);
    }
    showToast('수동 조편성이 저장되었습니다');
}

// --- Copy group text ---
function copyGroupText() {
    const round = activeRound();
    const groups = groupResults[round.id];
    if (!groups || !groups.some(g => g.length > 0)) {
        showToast('조편성 결과가 없습니다');
        return;
    }

    const labels = ['🟠 1조', '🔵 2조', '🩷 3조'];
    let text = `⛳ ${round.date} ${round.venue} 조편성\n\n`;
    groups.forEach((g, i) => {
        if (g.length === 0) return;
        text += `${labels[i]}\n${g.join(' / ')}\n\n`;
    });
    if (round.course) text += `🏌️ 코스: ${round.course}\n`;
    if (round.tee_time) text += `⏰ 티타임: ${round.tee_time}\n`;
    if (round.greenfee) text += `💰 그린피: ${Number(round.greenfee).toLocaleString()}원\n`;

    navigator.clipboard.writeText(text.trim()).then(() => {
        showToast('클립보드에 복사됐습니다 📋');
    }).catch(() => {
        // fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = text.trim();
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('클립보드에 복사됐습니다 📋');
    });
}

// --- Round info ---
function renderRoundDetailBar(round) {
    const items = [];
    if (round.course) items.push(`<div class="round-detail-item"><span class="detail-icon">🏌️</span>${round.course}</div>`);
    if (round.tee_time) items.push(`<div class="round-detail-item"><span class="detail-icon">⏰</span>${round.tee_time}</div>`);
    if (round.greenfee) items.push(`<div class="round-detail-item"><span class="detail-icon">💰</span>${Number(round.greenfee).toLocaleString()}원</div>`);
    items.push(`<button class="btn-edit-round" onclick="openRoundInfoModal()">✏️ 정보 입력</button>`);
    document.getElementById('roundDetailBar').innerHTML = items.join('');

    const notesEl = document.getElementById('roundNotes');
    if (round.notes) {
        notesEl.style.display = 'block';
        notesEl.querySelector('.notes-text').textContent = round.notes;
    } else {
        notesEl.style.display = 'none';
    }
}

function openRoundInfoModal() {
    const round = activeRound();
    document.getElementById('inputCourse').value = round.course || '';
    document.getElementById('inputTeeTime').value = round.tee_time || '';
    document.getElementById('inputGreenfee').value = round.greenfee || '';
    document.getElementById('inputNotes').value = round.notes || '';
    document.getElementById('roundInfoModalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputCourse').focus(), 100);
}

function closeRoundInfoModal() {
    document.getElementById('roundInfoModalOverlay').classList.remove('open');
}

async function saveRoundInfo() {
    const round = activeRound();
    const course = document.getElementById('inputCourse').value.trim() || null;
    const tee_time = document.getElementById('inputTeeTime').value.trim() || null;
    const greenfeeVal = document.getElementById('inputGreenfee').value.trim();
    const greenfee = greenfeeVal ? parseInt(greenfeeVal) : null;
    const notes = document.getElementById('inputNotes').value.trim() || null;

    const { error } = await sb.from('rounds').update({ course, tee_time, greenfee, notes }).eq('id', round.id);
    if (error) { showToast('저장 실패: ' + error.message); return; }

    const idx = rounds.findIndex(r => r.id === round.id);
    rounds[idx] = { ...rounds[idx], course, tee_time, greenfee, notes };
    closeRoundInfoModal();
    render();
    showToast('라운드 정보가 저장되었습니다');
}

// --- Reset ---
async function resetCurrentRound() {
    const round = activeRound();
    if (!confirm(`${round.date} 참석 신청을 모두 초기화할까요?`)) return;
    attendance[round.id] = new Set();
    guests[round.id] = new Set();
    groupResults[round.id] = null;
    render();
    await Promise.all([
        sb.from('attendance').delete().eq('round_id', round.id),
        sb.from('group_results').delete().eq('round_id', round.id),
    ]);
    showToast('초기화되었습니다');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- Custom round ---
function openModal() {
    document.getElementById('inputDate').value = '';
    document.getElementById('inputVenue').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('inputDate').focus(), 100);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

async function addCustomRound() {
    const date = document.getElementById('inputDate').value.trim();
    const venue = document.getElementById('inputVenue').value.trim();
    if (!date || !venue) { alert('날짜와 골프장을 모두 입력해주세요.'); return; }

    const id = 'custom_' + Date.now();
    const { error } = await sb.from('rounds').insert({ id, date, venue, is_custom: true });
    if (error) { alert('저장 실패: ' + error.message); return; }

    rounds.push({ id, date, venue, is_custom: true });
    sortRounds();
    attendance[id] = new Set();
    guests[id] = new Set();
    activeId = id;
    closeModal();
    render();
    setTimeout(() => {
        const idx = rounds.findIndex(r => r.id === id);
        const tabs = document.querySelectorAll('.tab-btn:not(.add-tab)');
        if (tabs[idx]) tabs[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }, 100);
}

async function deleteCurrentRound() {
    const round = activeRound();
    if (!confirm(`"${round.date} ${round.venue}" 라운드를 삭제할까요?\n참석 정보와 조편성 결과도 함께 삭제됩니다.`)) return;

    await Promise.all([
        sb.from('rounds').delete().eq('id', round.id),
        sb.from('attendance').delete().eq('round_id', round.id),
        sb.from('group_results').delete().eq('round_id', round.id),
        sb.from('scores').delete().eq('round_id', round.id),
    ]);

    rounds = rounds.filter(r => r.id !== round.id);
    delete attendance[round.id];
    delete groupResults[round.id];
    delete scores[round.id];
    activeId = rounds[0]?.id || null;
    render();
    showToast('라운드가 삭제되었습니다');
}

// --- UI helpers ---
function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('hidden', !v); }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// --- Page switch ---
function switchPage(page) {
    document.getElementById('pageRound').style.display = page === 'round' ? 'block' : 'none';
    document.getElementById('pageStats').style.display = page === 'stats' ? 'block' : 'none';
    document.getElementById('navRound').classList.toggle('active', page === 'round');
    document.getElementById('navStats').classList.toggle('active', page === 'stats');
    if (page === 'stats') renderStats();
}

// --- Stats ---
function renderStats() {
    const completedRounds = rounds.filter(r => {
        const g = groupResults[r.id];
        return g && g.some(grp => grp.length > 0);
    });
    const totalRounds = completedRounds.length;

    const stats = MEMBERS.map(name => {
        let att = 0;
        completedRounds.forEach(r => {
            if ((attendance[r.id] || new Set()).has(name)) att++;
        });
        return { name, att, abs: totalRounds - att };
    }).sort((a, b) => b.att - a.att || a.name.localeCompare(b.name));

    const totalAtt = stats.reduce((s, m) => s + m.att, 0);
    const avgAtt = totalRounds > 0 ? (totalAtt / MEMBERS.length).toFixed(1) : 0;
    const perfect = stats.filter(m => m.att === totalRounds && totalRounds > 0).length;
    document.getElementById('statsSummary').innerHTML = `
        <div class="summary-box"><div class="s-val">${totalRounds}</div><div class="s-label">진행 라운드</div></div>
        <div class="summary-box"><div class="s-val">${avgAtt}</div><div class="s-label">평균 참석 횟수</div></div>
        <div class="summary-box"><div class="s-val">${perfect}</div><div class="s-label">개근 멤버</div></div>
    `;

    let rank = 1;
    document.getElementById('statsBody').innerHTML = stats.map((m, i) => {
        if (i > 0 && stats[i-1].att !== m.att) rank = i + 1;
        const rate = totalRounds > 0 ? Math.round(m.att / totalRounds * 100) : 0;
        let rankClass = rank <= 3 ? `rank-${rank}` : 'rank-n';
        let rankLabel = rank <= 3 ? rank : '';
        return `
            <tr>
                <td>
                    <div style="display:flex;align-items:center;gap:7px">
                        <span class="rank-badge ${rankClass}">${rankLabel}</span>
                        ${m.name}
                    </div>
                </td>
                <td><span class="att-count">${m.att}</span></td>
                <td><span class="abs-count">${m.abs}</span></td>
                <td><span class="rate-text">${rate}%</span></td>
                <td>
                    <div class="att-bar-wrap">
                        <div class="att-bar" style="width:${rate}%"></div>
                    </div>
                </td>
            </tr>
        `;
    }).join('');

    if (totalRounds === 0) {
        document.getElementById('statsBody').innerHTML = `<tr><td colspan="5" style="text-align:center;color:#9aab9d;padding:24px">조편성이 완료된 라운드가 없습니다</td></tr>`;
    }

    renderScoreStats(completedRounds);
}

function renderScoreStats(completedRounds) {
    // 개인 타수 통계
    const memberScoreStats = MEMBERS.map(name => {
        const memberScores = completedRounds
            .map(r => scores[r.id] && scores[r.id][name])
            .filter(s => s !== undefined && s !== null);
        if (memberScores.length === 0) return { name, avg: null, best: null, worst: null, count: 0 };
        const avg = memberScores.reduce((a, b) => a + b, 0) / memberScores.length;
        return {
            name,
            avg: Math.round(avg * 10) / 10,
            best: Math.min(...memberScores),
            worst: Math.max(...memberScores),
            count: memberScores.length
        };
    }).filter(m => m.count > 0).sort((a, b) => a.avg - b.avg);

    if (memberScoreStats.length === 0) {
        document.getElementById('scoreStatsBody').innerHTML = `<tr><td colspan="5" style="text-align:center;color:#9aab9d;padding:16px">저장된 타수 기록이 없습니다</td></tr>`;
    } else {
        document.getElementById('scoreStatsBody').innerHTML = memberScoreStats.map((m, i) => {
            const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-n';
            const rankLabel = i < 3 ? i + 1 : '';
            return `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:7px">
                            <span class="rank-badge ${rankClass}">${rankLabel}</span>
                            ${m.name}
                        </div>
                    </td>
                    <td><span class="score-val">${m.avg}</span></td>
                    <td><span class="score-best">${m.best}</span></td>
                    <td><span class="score-worst">${m.worst}</span></td>
                    <td><span style="color:#6b7e72;font-size:12px">${m.count}회</span></td>
                </tr>
            `;
        }).join('');
    }

    // 라운드별 결과
    const roundsWithScores = completedRounds.filter(r => scores[r.id] && Object.keys(scores[r.id]).length > 0);
    if (roundsWithScores.length === 0) {
        document.getElementById('roundScoreList').innerHTML = `<div style="text-align:center;color:#9aab9d;padding:16px;font-size:13px">저장된 라운드 결과가 없습니다</div>`;
        return;
    }

    document.getElementById('roundScoreList').innerHTML = roundsWithScores.map(r => {
        const roundScores = scores[r.id];
        const entries = Object.entries(roundScores).sort((a, b) => a[1] - b[1]);
        const bestScore = entries[0][1];
        return `
            <div class="round-score-item">
                <div class="rsi-header">
                    <span class="rsi-date">${r.date}</span>
                    <span class="rsi-venue">${r.venue}</span>
                </div>
                <div class="round-score-chips">
                    ${entries.map(([name, score]) => `
                        <span class="rsc${score === bestScore ? ' best-score' : ''}">
                            <span class="rsc-name">${name}</span>
                            <span class="rsc-score">${score}</span>
                        </span>
                    `).join('')}
                </div>
            </div>
        `;
    }).join('');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('manualModalOverlay').addEventListener('click', function(e) { if (e.target === this) closeManualModal(); });
document.getElementById('roundInfoModalOverlay').addEventListener('click', function(e) { if (e.target === this) closeRoundInfoModal(); });
document.getElementById('inputGreenfee').addEventListener('keydown', function(e) { if (e.key === 'Enter') saveRoundInfo(); });
document.getElementById('inputVenue').addEventListener('keydown', function(e) { if (e.key === 'Enter') addCustomRound(); });
document.getElementById('guestModalOverlay').addEventListener('click', function(e) { if (e.target === this) closeGuestModal(); });
document.getElementById('inputGuestName').addEventListener('keydown', function(e) { if (e.key === 'Enter') addGuest(); });

// --- Theme ---
function applyTheme() {
    const h = new Date().getHours();
    // 오전 6시 ~ 오후 7시: 라이트, 그 외: 다크
    const isDark = h < 6 || h >= 19;
    document.body.classList.toggle('dark', isDark);
}
applyTheme();
// 정각마다 체크 (탭을 열어둔 상태에서 시간 넘어갈 때 대응)
setInterval(applyTheme, 60 * 1000);

init();
</script>
